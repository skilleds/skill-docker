# Pipeline de imagem: build -> scan (gate) -> [só em tag] multi-arch -> push por digest -> cosign keyless -> verificação.
# Piso 27: CI remoto NÃO roda por commit nem por PR. Gatilhos: workflow_dispatch (scan manual, sem push) e tag
# `hml-*`/`v*` (promoção: publica e assina). O scan por commit é LOCAL (`tools/ci.sh`, `trivy image` na máquina dev).
# Actions pinadas por SHA (verificados com `gh api` em 2026-10-14); renove por Renovate/Dependabot, não à mão.
# Ajuste: IMAGE (registro/nome) e a identidade esperada no `cosign verify` (repositório + workflow).
# Segredo de build por framework (ex.: Ruby/Rails) NÃO mora aqui: veja o exemplo em `references/linguagens.md` (Ruby).
name: docker

on:
  workflow_dispatch:
  push:
    tags: ["hml-*", "v*"]
    # tag não filtra por path; o paths-ignore documenta que docs/changelog não justificam promoção.
    paths-ignore:
      - "**.md"
      - "docs/**"

# Um build por ref; dispatch cancela o anterior. Release em tag nunca é cortada no meio por outra tag.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Piso global vazio; cada job declara só o que precisa.
permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 1) Build local de UMA arquitetura, escaneia e reprova. Nada sai do runner se falhar.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SOURCE_DATE_EPOCH do commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local (load) para o scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: HIGH/CRITICAL com correção disponível reprovam o job (exit-code 1).
      # ignore-unfixed: true ignora CVE SEM correção publicada, porque o time não tem ação possível
      # (a lista é revisada a cada troca de digest da base; CVE sem fix não pode travar release para sempre).
      - name: Trivy (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

  # 2) Só em TAG e só com o scan verde: multi-arch, SBOM e provenance, push, assinatura, verificação.
  #    O ops (nunca a IA nem `docker pull` manual) resolve tag -> digest e verifica o cosign na admissão.
  release:
    needs: scan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC do GitHub: identidade efêmera para o cosign keyless
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SOURCE_DATE_EPOCH do commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag imutável por commit; sem `latest`. Quem consome referencia o digest.
      - name: Metadados
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=long

      - name: Build e push (multi-arch, SBOM, provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Assina o DIGEST (nunca a tag, que é móvel). Keyless: certificado de curta duração ligado ao OIDC.
      - name: Cosign sign (keyless, por digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Prova de ponta a ponta: a assinatura existe e veio DESTE workflow, neste repositório, em tag.
      - name: Cosign verify (identidade esperada)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${REPO}/\.github/workflows/docker\.yml@refs/tags/(hml-|v).*$" \
            "${IMAGE}@${DIGEST}"
